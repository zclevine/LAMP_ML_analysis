# Compressing, caching reverse proxy in front of Streamlit.
#
# Streamlit deliberately serves /static/ uncompressed. Its own comment in
# streamlit/web/server/starlette/starlette_gzip_middleware.py gives the reason,
# and it is a good one: Starlette's GZipMiddleware re-compresses the body on
# every request and never caches the result, so compressing at the Python
# origin burns CPU on every hit for a bandwidth saving each client only
# collects once (the bundles are content-hashed and served immutable,
# max-age=1yr). Their load testing found the bypass *improved* initial load
# time and peak RSS under concurrency.
#
# The sentence that matters for us is the next one: "Production usually sits
# behind a reverse proxy / CDN that compresses and caches these responses."
# That is the missing piece, not a Streamlit bug. This config is that piece.
#
# gzip_static + proxy_cache means each asset is compressed ONCE and then served
# from cache, which answers the CPU objection instead of ignoring it.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    access_log    off;

    # Compress once, keep the result. Without this a proxy is no better than
    # the origin -- it would re-gzip per request exactly as Starlette does.
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=assets:10m
                     max_size=256m inactive=7d use_temp_path=off;

    gzip              on;
    gzip_comp_level   6;      # 9 costs ~2x CPU for ~1% size; not worth it
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        application/javascript text/javascript application/json
                      text/css text/plain text/html image/svg+xml
                      application/wasm font/ttf application/x-font-ttf;
    # NOT woff2: it is already compressed, and re-gzipping it wastes CPU and
    # can make it marginally larger.

    upstream streamlit {
        server 127.0.0.1:8501;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # Streamlit buffers an entire upload in memory before the app sees a
        # byte, and the app's own cap is 5 MB. Rejecting here means an
        # oversized upload never reaches Python at all.
        client_max_body_size 6m;

        # The websocket carries every interaction, so it must not be buffered,
        # cached, or timed out at proxy defaults. Getting this wrong is the
        # usual way a proxied Streamlit "connects" then goes blank.
        location /_stcore/stream {
            proxy_pass         http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # The compressible, cacheable, content-hashed bundle. This is the whole
        # point of the file.
        location /static/ {
            proxy_pass          http://streamlit;
            proxy_http_version  1.1;
            proxy_set_header    Host $host;
            proxy_set_header    Connection "";
            proxy_cache         assets;
            proxy_cache_valid   200 7d;
            # Content-hashed filenames, so a cached entry can never be stale.
            proxy_cache_key     $uri;
            proxy_cache_use_stale error timeout updating;
            add_header          X-Cache-Status $upstream_cache_status;
        }

        location / {
            proxy_pass         http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";
            proxy_read_timeout 600s;
        }
    }
}
