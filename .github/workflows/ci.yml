# CI for the LAMP design engine.
#
# This lives in .github/workflows/, not workflows/. The repo carried an empty
# top-level `workflows/` directory for a while, which GitHub never reads, so
# nothing ran -- and the Docker image went unbuilt long enough to accumulate
# two defects that only a build would find (a missing libopenblas that broke
# `import RNA`, and an unpinned ViennaRNA that resolved to 2.7.2 against the
# 2.4.17 the dG features were validated on).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # RNAduplex and MAFFT come from apt here for the same reason the Modal
      # image uses apt: the pinned 2.4.17 build is what the dG parity test
      # expects. The real-model tests RUN here, because the five-seed ensemble
      # is bundled in the package (2.8 MB) -- so CI exercises checkpoint
      # loading and prediction rather than skipping past them.
      - name: Install external tools
        run: |
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y vienna-rna mafft
          RNAduplex --version
          mafft --version 2>&1 | head -1

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest

      - name: Tests
        run: pytest -q

      # The suite silently skips its most meaningful tests without weights, so
      # make the skip count visible rather than letting a green tick hide it.
      - name: Report skips
        if: always()
        run: pytest -q -rs 2>&1 | tail -25

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No push, no registry, no credentials: the point is that the image
      # BUILDS, because both of its in-image verify steps (tool versions, the
      # CPU-only torch assert, and the real `predict_tp` import) only run
      # during a build.
      - name: Build the CLI image
        run: docker build -t lamp-design:cpu .

      - name: Build the portal image
        run: docker build -t lamp-design:portal -f Dockerfile.portal .

      # Guards the pin that decides every dG. Asserted in the Dockerfile too;
      # repeated here so a change that removes the in-image check still fails.
      - name: RNAduplex is the validated version
        run: |
          docker run --rm lamp-design:cpu RNAduplex --version | grep -q '2\.4\.17'

      - name: The portal serves on $PORT
        run: |
          docker run -d --name portal -p 8080:8080 lamp-design:portal
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "portal responded after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "portal did not respond within 30s"; docker logs portal; exit 1

      - name: Stop the portal
        if: always()
        run: docker rm -f portal || true
